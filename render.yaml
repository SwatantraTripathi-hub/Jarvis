services:
  # ── Backend API ──────────────────────────────────────────────
  - type: web
    name: jarvis-backend
    runtime: node
    rootDir: Backend
    buildCommand: npm install && cd ../frontend && npm install && npm run build && rm -rf ../Backend/public && mkdir -p ../Backend/public && cp -r build/* ../Backend/public/
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # ── Set the values below in Render Dashboard → Environment ──
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: Pine_Cone_Api_key
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: GEMINI_EMBEDDING_DIMENSION
        value: '768'
      - key: FRONTEND_URL
        sync: false
